<div class="home">
  <header class="container-fluid p-3 d-flex justify-content-between align-items-start">
  <button
    class="btn text-success border-0 p-0 m-2"
    type="button"
    data-bs-toggle="offcanvas"
    data-bs-target="#menuLateral"
    aria-controls="menuLateral"
  >
    <i class="bi bi-list fs-2"></i>
  </button>

  <button class="btn text-secondary border-0 p-0 m-2" id="btnLogout" title="Sair do Sistema">
    <i class="bi bi-box-arrow-right fs-4"></i>
  </button>
</header>

<aside
  class="offcanvas offcanvas-start shadow"
  tabindex="-1"
  id="menuLateral"
  aria-labelledby="menuLateralLabel"
  style="width: 280px"
>
  <div class="offcanvas-header justify-content-center border-bottom pt-4 pb-3">
    <img src="img/ford.png" alt="Ford Logo" style="width: 110px" />
  </div>
  <nav class="offcanvas-body p-0 list-group list-group-flush mt-2">
    <a routerLink="/home" class="list-group-item list-group-item-action menu-item active-menu"
      >Home</a
    >
    <a routerLink="/dashboard" class="list-group-item list-group-item-action menu-item">Dashboard</a>
  </nav>
</aside>

<main class="container d-flex justify-content-center align-items-center" style="height: 70vh">
  <article class="card welcome-card shadow-lg">
    <header
      class="card-header bg-transparent border-bottom text-secondary"
      style="font-size: 0.9rem"
    >
      Sistema de dados FORD
    </header>
    <div
      class="card-body d-flex justify-content-center align-items-center"
      style="min-height: 200px"
    >
      <h4 class="fw-bold color-primary m-0">Seja bem-vindo(a)!</h4>
    </div>
  </article>
</main>
</div>
