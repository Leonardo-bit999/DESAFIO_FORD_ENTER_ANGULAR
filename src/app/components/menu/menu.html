<header
    class="container-fluid p-0 d-flex justify-content-between align-items-start bg-light border-bottom menu"
  >
    <button
      class="btn text-success border-0 p-0 m-2"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#menuLateral"
      aria-controls="menuLateral"
    >
      <i class="bi bi-list fs-2"></i>
    </button>
  </header>

<aside
  class="offcanvas offcanvas-start shadow"
  tabindex="-1"
  id="menuLateral"
  aria-labelledby="menuLateralLabel"
  style="width: 200px">
  <div class="offcanvas-header justify-content-center border-bottom pt-4 pb-3">
    <img src="img/ford.png" alt="Ford Logo" style="width: 110px"/>
  </div>
  
  <nav class="offcanvas-body p-0 list-group list-group-flush mt-2">
    <div>
      <a
      routerLink="/home"
      routerLinkActive="active-menu"
      class="list-group-item list-group-item-action menu-item"
      >Home</a>
    <a
      routerLink="/dashboard"
      routerLinkActive="active-menu"
      class="list-group-item list-group-item-action menu-item"
      >Dashboard</a>
    </div>
    <button 
      class="list-group-item list-group-item-action text-danger mt-auto fw-bold" (click)="sair()">
      <i class="bi bi-box-arrow-right me-2" ></i> Sair do Sistema
    </button>
  </nav>
</aside>
