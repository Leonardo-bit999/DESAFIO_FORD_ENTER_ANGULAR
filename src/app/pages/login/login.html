<main class="container-fluid vh-100 p-0">
  <div class="row g-0 h-100">
    <figure
      class="col-md-7 d-none d-md-flex align-items-center justify-content-center login-image-container m-0"
    >
      <img src="img/ranger.png" alt="Ford Ranger" class="login-ranger-img" />
    </figure>

    <section class="col-md-5 login-form-container px-4">
      <form (ngSubmit)="login()" id="loginForm" class="login-form-box">
        <header class="text-center mb-5">
          <img src="img/ford.png" alt="Logo Ford" class="login-logo mb-4" />
          <h4 class="fw-bold color-primary m-0">Boas-vindas</h4>
        </header>

        <div class="input-group mb-3">
          <span class="input-group-text bg-white border-end-0 text-muted">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            class="form-control border-start-0 ps-0"
            id="usuario"
            placeholder="Insira nome de usuário"
            [(ngModel)]="usuario.nome"
            name="nome"
            required
          />
        </div>

        <div class="input-group mb-4">
          <span class="input-group-text bg-white border-end-0 text-muted">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            class="form-control border-start-0 ps-0"
            [(ngModel)]="usuario.senha"
            name="senha"
            id="senha"
            placeholder="Insira sua senha"
            required
          />
        </div>

        <div *ngIf="mensagemErro" class="alert alert-danger py-2 small mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          {{ mensagemErro }}
        </div>

        <button
          type="submit"
          id="btnEntrar"
          class="btn btn-entrar w-100 fw-bold py-2"
          [disabled]="!usuario.nome || !usuario.senha"
        >
          Entrar
        </button>
      </form>
    </section>
  </div>
</main>
